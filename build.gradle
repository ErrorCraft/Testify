plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"testify" {
			sourceSet sourceSets.main
		}
	}

	runs {
		server {
			name "GameTest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"

			runDir "build/gametest"
			source sourceSets.main
		}
		client {
			name "GameTest Client"
			vmArg "-Dfabric-api.gametest.structures.output-dir=${file("src/main/resources/data/testify/gametest/structures")}"

			runDir "run"
			source sourceSets.client
		}
	}

	accessWidenerPath = file("src/main/resources/testify.classtweaker")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

static void setupRepositories(RepositoryHandler repositories) {
	Map<String, String> env = System.getenv()

	if (env.MAVEN_URL) {
		repositories.maven {
			credentials {
				username env.MAVEN_USERNAME
				password env.MAVEN_PASSWORD
			}
			url env.MAVEN_URL
		}
	} else {
		repositories.mavenLocal()
	}
}

afterEvaluate {
	publishing {
		apply plugin: "maven-publish"

		publications {
			create("mavenJava", MavenPublication) {
				artifactId = project.archives_base_name
				from components.java
			}
		}

		setupRepositories(repositories)
	}
}
